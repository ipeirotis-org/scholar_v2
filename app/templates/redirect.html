{% extends "base.html" %}

{% block title %}Processing -- Scholar Analytics{% endblock %}

{% block content %}
<div class="container mt-4 text-center">
    <h2>Author Data Processing</h2>
    <p id="message">Author id {{ author_id }} is being processed or queued. The page will refresh automatically. Please wait...</p>
</div>
{% endblock %}

{% block scripts %}
<script>
    setTimeout(function() {
        window.location.href = "/results?author_id={{ author_id }}";
    }, 30000);
</script>
{% endblock %}
