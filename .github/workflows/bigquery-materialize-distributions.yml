name: Materialize Percentile Distribution Tables

on:
  # Run quarterly — 1st day of Jan, Apr, Jul, Oct at 04:00 UTC.
  # These tables are expensive to compute but change slowly (population
  # percentiles shift only when many new authors/papers are added).
  schedule:
    - cron: '0 4 1 1,4,7,10 *'

  # Allow manual trigger for ad-hoc refreshes
  workflow_dispatch:

env:
  PROJECT_ID: scholar-version2

jobs:
  materialize-distributions:
    name: Materialize percentile distribution tables (quarterly)
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    # Distribution tables — the ONLY place PERCENT_RANK() runs.
    # Output is small (distinct values only).
    # Materialized in strict DAG order — see docs/architecture-analytics-details.md.
    #
    # PREREQUISITE: S2 dataset tables (s2_data.papers, s2_data.authors,
    # s2_data.author_paper_stats, s2_data.paper_citations_by_year) must be
    # loaded by the dataset ingestion pipeline before running distributions.

    # ── Step 1: Level 1 (independent — read from S2 data tables) ──────
    - name: 'Step 1a: dist_publication_citations (Level 1)'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/dist_publication_citations.sql

    - name: 'Step 1b: dist_author_metrics (Level 1)'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/dist_author_metrics.sql

    # ── Step 2: Level 2 (depends on Level 1 views) ────────────────────
    - name: 'Step 2: dist_publication_citations_temporal (Level 2)'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/dist_publication_citations_temporal.sql

    # ── Step 3: Level 4 (depends on Level 2-3 views + Step 1 tables) ──
    - name: 'Step 3a: dist_author_metrics_temporal (Level 4)'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/dist_author_metrics_temporal.sql

    - name: 'Step 3b: dist_pip_auc_scores (Level 4)'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/dist_pip_auc_scores.sql

    # ── Step 4: Level 6 (depends on Level 5 views + Step 2-3 tables) ──
    - name: 'Step 4: dist_pip_auc_scores_temporal (Level 6)'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/dist_pip_auc_scores_temporal.sql
