name: Deploy Google Scholar Crawler

# Cloud Run Job that refreshes Google Scholar profiles via SerpApi (profiles only),
# rebuilds the gs_statistics distribution tables, and loads GS IDs from Wikidata
# (name search + ingestion priority). The materialize and wikidata modes also
# rebuild the app's author search index when DATA_SOURCE=gs, and the homepage's
# featured authors.

on:
  push:
    branches: [main]
    paths:
      - 'gs_crawler/**'
      - 'bigquery/gs_statistics/**'
      - 'author_search/**'
      - 'shared/**'
      - '.github/workflows/deploy-gs-crawler.yml'

  workflow_dispatch:
    inputs:
      crawl_mode:
        description: 'Optional CRAWL_MODE to run immediately after deploy (leave empty to deploy only)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'featured'
          - 'materialize'
          - 'deploy'
          - 'invalidate_legacy_pip'
          - 'refresh'
          - 'wikidata'

env:
  GCP_PROJECT_ID: scholar-version2
  GCP_REGION: us-central1
  GAR_LOCATION: us-central1
  REPOSITORY_NAME: scholar-repo
  IMAGE_NAME: gs_crawler
  JOB_NAME: gs-crawler
  # Runs as claude-agent, which already has BigQuery, GCS and Secret Manager access.
  JOB_SA: claude-agent@scholar-version2.iam.gserviceaccount.com
  # SerpApi Developer plan: 5,000 searches/month. Daily runs of up to 130 searches
  # (~3,900/month) leave >= 1,000 for on-demand lookups.
  MAX_SEARCHES_PER_RUN: '130'
  SERPAPI_SEARCH_RESERVE: '1000'
  # Same switch as deploy-frontend.yml; selects the search index the job rebuilds.
  DATA_SOURCE: ${{ vars.DATA_SOURCE || 'gs' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install -r gs_crawler/requirements.txt pytest

    - name: Run tests
      run: python -m pytest gs_crawler/tests/ -v

  deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Build and Push Image
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |-
        gcloud builds submit \
          --config /dev/stdin <<CLOUDBUILD
        steps:
          - name: 'gcr.io/cloud-builders/docker'
            args: ['build', '-f', 'gs_crawler/Dockerfile', '-t', '$IMAGE_PATH', '.']
        images: ['$IMAGE_PATH']
        CLOUDBUILD

    - name: Deploy Cloud Run Job
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |-
        ACTION=create
        if gcloud run jobs describe ${{ env.JOB_NAME }} --region=${{ env.GCP_REGION }} > /dev/null 2>&1; then
          ACTION=update
        fi
        gcloud run jobs $ACTION ${{ env.JOB_NAME }} \
          --image "$IMAGE_PATH" \
          --region ${{ env.GCP_REGION }} \
          --service-account=${{ env.JOB_SA }} \
          --memory=1Gi \
          --cpu=1 \
          --task-timeout=3600 \
          --max-retries=0 \
          --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},CRAWL_MODE=refresh,MAX_SEARCHES_PER_RUN=${{ env.MAX_SEARCHES_PER_RUN }},SERPAPI_SEARCH_RESERVE=${{ env.SERPAPI_SEARCH_RESERVE }},DATA_SOURCE=${{ env.DATA_SOURCE }}"

    - name: Create or update schedulers
      run: |-
        JOB_URI="https://${{ env.GCP_REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.GCP_PROJECT_ID }}/jobs/${{ env.JOB_NAME }}:run"
        upsert() {
          NAME="$1"; SCHEDULE="$2"; BODY="$3"
          # create takes --headers; update only accepts --update-headers.
          ACTION=create
          HEADERS_FLAG="--headers=Content-Type=application/json"
          if gcloud scheduler jobs describe "$NAME" --location="${{ env.GCP_REGION }}" > /dev/null 2>&1; then
            ACTION=update
            HEADERS_FLAG="--update-headers=Content-Type=application/json"
          fi
          gcloud scheduler jobs $ACTION http "$NAME" \
            --location="${{ env.GCP_REGION }}" \
            --schedule="$SCHEDULE" \
            --uri="$JOB_URI" \
            --http-method=POST \
            "$HEADERS_FLAG" \
            --message-body="$BODY" \
            --time-zone=UTC \
            --attempt-deadline=600s \
            --oauth-service-account-email="${{ env.JOB_SA }}"
        }
        # Daily profile refresh (queued on-demand authors first, then stalest).
        upsert gs-daily-refresh "17 4 * * *" '{}'
        # Weekly rebuild of percentile distribution tables.
        upsert gs-weekly-materialize "47 5 * * 1" \
          '{"overrides":{"containerOverrides":[{"env":[{"name":"CRAWL_MODE","value":"materialize"}]}]}}'
        # Monthly reload of GS IDs from Wikidata (+ Wikipedia pageviews), 3rd of the month.
        upsert gs-monthly-wikidata "41 3 3 * *" \
          '{"overrides":{"containerOverrides":[{"env":[{"name":"CRAWL_MODE","value":"wikidata"}]}]}}'

    - name: Execute Cloud Run Job (if crawl_mode requested)
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.crawl_mode != '' }}
      env:
        CRAWL_MODE_INPUT: ${{ inputs.crawl_mode }}
      run: |-
        gcloud run jobs execute ${{ env.JOB_NAME }} \
          --region=${{ env.GCP_REGION }} \
          --update-env-vars="CRAWL_MODE=${CRAWL_MODE_INPUT}" \
          --wait
