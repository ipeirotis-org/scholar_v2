name: Deploy BigQuery Views

on:
  push:
    branches:
      - main
    paths:
      - 'bigquery/**/*.sql'

  # Allow manual trigger for deploying all views on demand
  workflow_dispatch:

env:
  PROJECT_ID: scholar-version2

jobs:
  deploy-bigquery-views:
    name: Deploy BigQuery Views
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    # NOTE: Distribution tables (dist_*) are NOT recreated here.
    # They are materialized quarterly by bigquery-materialize-distributions.yml
    # and must already exist before deploying views that reference them.
    # To refresh them manually, trigger that workflow via workflow_dispatch.

    # ── Tier 1: Raw statistics (no percentiles, no PERCENT_RANK) ─────────────
    # Read from scholar_raw_data.*_latest only.
    - name: 'Tier 1: base_author_publications'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/base_author_publications.sql

    - name: 'Tier 1: stats_publication_current'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/stats_publication_current.sql

    - name: 'Tier 1: stats_publication_citations_temporal'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/stats_publication_citations_temporal.sql

    - name: 'Tier 1: coauthor_network'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/coauthor_network/coauthor_network.sql

    # Depends on Tier 1 base views
    - name: 'Tier 1: stats_author_current'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/stats_author_current.sql

    - name: 'Tier 1: coauthors_to_add'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/coauthor_network/coauthors_to_add.sql

    - name: 'Tier 1: intermediate_author_publication_state_temporal'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/intermediate_author_publication_state_temporal.sql

    - name: 'Tier 1: stats_author_metrics_temporal_view'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/stats_author_metrics_temporal.sql

    # ── Tier 3: Ranked views (cheap JOINs of Tier 1 + Tier 2 dist tables) ───
    - name: 'Tier 3: ranked_publication_current'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/ranked_publication_current.sql

    - name: 'Tier 3: ranked_author_current'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/ranked_author_current.sql

    - name: 'Tier 3: ranked_publication_citations_temporal'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/ranked_publication_citations_temporal.sql

    - name: 'Tier 3: ranked_author_metrics_temporal'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/ranked_author_metrics_temporal.sql

    # ── PiP pipeline (depends on ranked_publication_current + dist tables) ───
    - name: 'PiP: stats_author_publication_pip_inputs_current'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/stats_author_publication_pip_inputs_current.sql

    - name: 'PiP: stats_author_pip_scores_current'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/stats_author_pip_scores_current.sql

    - name: 'Tier 3: ranked_author_pip_scores_current'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/ranked_author_pip_scores_current.sql

    # ── Temporal PiP pipeline (depends on dist_publication_citations_temporal + dist_author_metrics_temporal) ─
    - name: 'PiP temporal: stats_author_pip_scores_temporal_view'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/stats_author_pip_scores_temporal.sql

    - name: 'Tier 3: ranked_author_pip_scores_temporal'
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < bigquery/statistics/ranked_author_pip_scores_temporal.sql
