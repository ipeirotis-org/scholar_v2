name: Materialize BigQuery Tables

on:
  # Run daily at 06:00 UTC (after overnight data loads settle)
  schedule:
    - cron: '0 6 * * *'

  # Allow manual trigger
  workflow_dispatch:

env:
  PROJECT_ID: scholar-version2

jobs:
  materialize:
    name: Materialize snapshot tables (daily)
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    # Full-table snapshots — only needed for all-authors list queries and
    # temporal history. Per-author profile queries use the views directly
    # (cheap with dist lookups).
    #
    # NOTE: Distribution tables (dist_*) are materialized separately on a
    # quarterly schedule by bigquery-materialize-distributions.yml.
    # They change slowly and are expensive to recompute.
    #
    # Snapshot tables source from ranked_* views (Tier 3) which include
    # both raw metrics and percentile columns.

    - name: 'Step 1: ranked_author_current_table (for all-authors list)'
      run: |
        bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false \
          "CREATE OR REPLACE TABLE \`scholar-version2.statistics.ranked_author_current_table\`
           CLUSTER BY scholar_id, year_of_first_pub
           AS SELECT * FROM \`scholar-version2.statistics.ranked_author_current\`"

    - name: 'Step 2: ranked_author_pip_scores_current_table (for all-authors list)'
      run: |
        bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false \
          "CREATE OR REPLACE TABLE \`scholar-version2.statistics.ranked_author_pip_scores_current_table\`
           CLUSTER BY scholar_id
           AS SELECT * FROM \`scholar-version2.statistics.ranked_author_pip_scores_current\`"

    - name: 'Step 3: ranked_author_metrics_temporal_table (temporal history)'
      run: |
        bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false \
          "CREATE OR REPLACE TABLE \`scholar-version2.statistics.ranked_author_metrics_temporal_table\`
           CLUSTER BY scholar_id, state_year
           AS SELECT * FROM \`scholar-version2.statistics.ranked_author_metrics_temporal\`"

    - name: 'Step 4: ranked_author_pip_scores_temporal_table (temporal PiP history)'
      run: |
        bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false \
          "CREATE OR REPLACE TABLE \`scholar-version2.statistics.ranked_author_pip_scores_temporal_table\`
           CLUSTER BY scholar_id, state_year
           AS SELECT * FROM \`scholar-version2.statistics.ranked_author_pip_scores_temporal\`"
