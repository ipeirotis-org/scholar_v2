name: Deploy Google Cloud Functions

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: scholar-version2

jobs:
  deploy-cloud-functions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region:  [ "us-central1",  "us-east1",  "us-east4", "us-east5", "us-south1",  "us-west1", "us-west2", "us-west3", "us-west4"]

        function_details:
          - name: fetch_publication
            timeout: "60s"
            memory: 512MB
          - name: fetch_author
            timeout: "3600s"
            memory: 512MB
          - name: find_scholar_id_from_name
            timeout: "3600s"
            memory: 512MB
          - name: batch_load_gcs_to_bq
            timeout: "3600s"
            memory: 512MB

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare shared code for Cloud Function ${{ matrix.function_details.name }}
      run: |
        mkdir -p ./functions/${{ matrix.function_details.name }}/shared/
        cp -r ./shared/* ./functions/${{ matrix.function_details.name }}/shared/

    - name: Deploy Cloud Function ${{ matrix.function_details.name }} to ${{ matrix.region }}
      run: |
        gcloud functions deploy "${{ matrix.function_details.name }}" \
          --region "${{ matrix.region }}" \
          --entry-point "${{ matrix.function_details.name }}" \
          --runtime python312 \
          --trigger-http \
          --allow-unauthenticated \
          --memory="${{ matrix.function_details.memory }}" \
          --timeout="${{ matrix.function_details.timeout }}" \
          --gen2 \
          --source "./functions/${{ matrix.function_details.name }}/"

  # Deploy Cloud Scheduler job to trigger batch_load_gcs_to_bq hourly.
  # Runs after function deployment so the target URL exists.
  deploy-batch-load-scheduler:
    needs: deploy-cloud-functions
    runs-on: ubuntu-latest

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Create or update Cloud Scheduler job for batch loading
      run: |
        JOB_NAME="batch-load-gcs-to-bq"
        LOCATION="us-central1"
        SCHEDULE="0 * * * *"  # Every hour
        TARGET_URL="https://${LOCATION}-${{ env.PROJECT_ID }}.cloudfunctions.net/batch_load_gcs_to_bq"
        TIME_ZONE="UTC"

        # Try to update existing job; create if it doesn't exist yet
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" --project="${{ env.PROJECT_ID }}" > /dev/null 2>&1; then
          echo "Updating existing scheduler job: $JOB_NAME"
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="$SCHEDULE" \
            --uri="$TARGET_URL" \
            --http-method=GET \
            --time-zone="$TIME_ZONE" \
            --attempt-deadline=1800s
        else
          echo "Creating new scheduler job: $JOB_NAME"
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="$SCHEDULE" \
            --uri="$TARGET_URL" \
            --http-method=GET \
            --time-zone="$TIME_ZONE" \
            --attempt-deadline=1800s
        fi
