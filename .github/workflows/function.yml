name: Deploy Cloud Functions

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: scholar-version2

jobs:
  # --- v3 crawler functions (fetch_author, fetch_publication) ---
  deploy-v3-crawler:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ["us-central1", "us-east1", "us-east4", "us-east5", "us-south1", "us-west1", "us-west2", "us-west3", "us-west4"]
        function:
          - name: v3_fetch_author
            entry_point: v3_fetch_author
            timeout: "3600s"
            memory: 512MB
            source_main: v3/crawler/fetch_author.py
          - name: v3_fetch_publication
            entry_point: v3_fetch_publication
            timeout: "60s"
            memory: 512MB
            source_main: v3/crawler/fetch_publication.py

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare source for ${{ matrix.function.name }}
      run: |
        mkdir -p /tmp/deploy/crawler
        # Copy crawler package
        cp v3/crawler/__init__.py /tmp/deploy/crawler/
        cp v3/crawler/config.py /tmp/deploy/crawler/
        cp v3/crawler/scholarly_client.py /tmp/deploy/crawler/
        cp v3/crawler/gcs_writer.py /tmp/deploy/crawler/
        cp v3/crawler/task_enqueuer.py /tmp/deploy/crawler/
        # Copy the entry point as main.py
        cp "${{ matrix.function.source_main }}" /tmp/deploy/main.py
        # Copy requirements
        cp v3/crawler/requirements.txt /tmp/deploy/requirements.txt
        # Fix imports: v3.crawler -> crawler
        sed -i 's/from v3\.crawler\./from crawler./g' /tmp/deploy/crawler/*.py
        sed -i 's/from v3\.crawler\./from crawler./g' /tmp/deploy/main.py

    - name: Deploy ${{ matrix.function.name }} to ${{ matrix.region }}
      run: |
        gcloud functions deploy "${{ matrix.function.name }}" \
          --region "${{ matrix.region }}" \
          --entry-point "${{ matrix.function.entry_point }}" \
          --runtime python312 \
          --trigger-http \
          --allow-unauthenticated \
          --memory="${{ matrix.function.memory }}" \
          --timeout="${{ matrix.function.timeout }}" \
          --gen2 \
          --source /tmp/deploy/

  # --- v3 ingestion function (batch_load) ---
  deploy-v3-ingestion:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare source for v3_batch_load
      run: |
        mkdir -p /tmp/deploy-ingestion/ingestion
        # Copy ingestion package
        cp v3/ingestion/__init__.py /tmp/deploy-ingestion/ingestion/
        cp v3/ingestion/config.py /tmp/deploy-ingestion/ingestion/
        cp v3/ingestion/batch_load.py /tmp/deploy-ingestion/ingestion/
        # Create main.py entry point
        cp v3/ingestion/batch_load.py /tmp/deploy-ingestion/main.py
        # Copy requirements
        cp v3/ingestion/requirements.txt /tmp/deploy-ingestion/requirements.txt
        # Fix imports: v3.ingestion -> ingestion
        sed -i 's/from v3\.ingestion\./from ingestion./g' /tmp/deploy-ingestion/ingestion/*.py
        sed -i 's/from v3\.ingestion\./from ingestion./g' /tmp/deploy-ingestion/main.py

    - name: Deploy v3_batch_load to us-central1
      run: |
        gcloud functions deploy "v3_batch_load_gcs_to_bq" \
          --region "us-central1" \
          --entry-point "batch_load_gcs_to_bq" \
          --runtime python312 \
          --trigger-http \
          --allow-unauthenticated \
          --memory="512MB" \
          --timeout="3600s" \
          --gen2 \
          --source /tmp/deploy-ingestion/

  # --- v3 ingestion dedup views ---
  deploy-v3-dedup-views:
    needs: deploy-v3-ingestion
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Deploy dedup views (author_latest, pub_latest)
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < v3/ingestion/dedup_views.sql

  # --- Legacy functions (not yet migrated to v3) ---
  deploy-legacy-functions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ["us-central1", "us-east1", "us-east4", "us-east5", "us-south1", "us-west1", "us-west2", "us-west3", "us-west4"]
        function_details:
          - name: find_scholar_id_from_name
            timeout: "3600s"
            memory: 512MB
          - name: batch_load_gcs_to_bq
            timeout: "3600s"
            memory: 1024MB

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare shared code for ${{ matrix.function_details.name }}
      run: |
        mkdir -p ./functions/${{ matrix.function_details.name }}/shared/
        cp -r ./shared/* ./functions/${{ matrix.function_details.name }}/shared/

    - name: Deploy ${{ matrix.function_details.name }} to ${{ matrix.region }}
      run: |
        gcloud functions deploy "${{ matrix.function_details.name }}" \
          --region "${{ matrix.region }}" \
          --entry-point "${{ matrix.function_details.name }}" \
          --runtime python312 \
          --trigger-http \
          --allow-unauthenticated \
          --memory="${{ matrix.function_details.memory }}" \
          --timeout="${{ matrix.function_details.timeout }}" \
          --gen2 \
          --source "./functions/${{ matrix.function_details.name }}/"

  # Cloud Scheduler for batch loading (hourly)
  deploy-batch-load-scheduler:
    needs: deploy-legacy-functions
    runs-on: ubuntu-latest

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Create or update Cloud Scheduler job for batch loading
      run: |
        JOB_NAME="batch-load-gcs-to-bq"
        LOCATION="us-central1"
        SCHEDULE="0 * * * *"
        TARGET_URL="https://${LOCATION}-${{ env.PROJECT_ID }}.cloudfunctions.net/batch_load_gcs_to_bq"
        TIME_ZONE="UTC"

        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" --project="${{ env.PROJECT_ID }}" > /dev/null 2>&1; then
          echo "Updating existing scheduler job: $JOB_NAME"
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="$SCHEDULE" \
            --uri="$TARGET_URL" \
            --http-method=GET \
            --time-zone="$TIME_ZONE" \
            --attempt-deadline=1800s
        else
          echo "Creating new scheduler job: $JOB_NAME"
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="$SCHEDULE" \
            --uri="$TARGET_URL" \
            --http-method=GET \
            --time-zone="$TIME_ZONE" \
            --attempt-deadline=1800s
        fi
