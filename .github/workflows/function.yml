name: Deploy Cloud Functions

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: scholar-version2

jobs:
  # --- Crawler functions (fetch_author, fetch_publication) ---
  deploy-crawler:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ["us-central1", "us-east1", "us-east4", "us-east5", "us-south1", "us-west1", "us-west2", "us-west3", "us-west4", "northamerica-northeast1", "northamerica-northeast2", "europe-west1", "europe-west2", "asia-east1", "asia-northeast1"]
        function:
          - name: v3_fetch_author
            entry_point: v3_fetch_author
            timeout: "3600s"
            memory: 512MB
            source_main: crawler/fetch_author.py
          - name: v3_fetch_publication
            entry_point: v3_fetch_publication
            timeout: "60s"
            memory: 512MB
            source_main: crawler/fetch_publication.py

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare source for ${{ matrix.function.name }}
      run: |
        mkdir -p /tmp/deploy/crawler /tmp/deploy/region_health
        # Copy crawler package
        cp crawler/__init__.py /tmp/deploy/crawler/
        cp crawler/config.py /tmp/deploy/crawler/
        cp crawler/scholarly_client.py /tmp/deploy/crawler/
        cp crawler/gcs_writer.py /tmp/deploy/crawler/
        cp crawler/task_enqueuer.py /tmp/deploy/crawler/
        # Copy region_health package (config + router only; scorer not needed)
        cp region_health/__init__.py /tmp/deploy/region_health/
        cp region_health/config.py /tmp/deploy/region_health/
        cp region_health/router.py /tmp/deploy/region_health/
        # Copy the entry point as main.py
        cp "${{ matrix.function.source_main }}" /tmp/deploy/main.py
        # Copy requirements
        cp crawler/requirements.txt /tmp/deploy/requirements.txt

    - name: Deploy ${{ matrix.function.name }} to ${{ matrix.region }}
      run: |
        for attempt in 1 2 3 4; do
          gcloud functions deploy "${{ matrix.function.name }}" \
            --region "${{ matrix.region }}" \
            --entry-point "${{ matrix.function.entry_point }}" \
            --runtime python312 \
            --trigger-http \
            --no-allow-unauthenticated \
            --memory="${{ matrix.function.memory }}" \
            --timeout="${{ matrix.function.timeout }}" \
            --set-env-vars "FUNCTION_LOCATION=${{ matrix.region }}" \
            --gen2 \
            --source /tmp/deploy/ \
          && break
          echo "Attempt $attempt failed. Retrying in $((attempt * 30))s..."
          sleep $((attempt * 30))
        done

  # --- Ingestion function (batch_load) ---
  deploy-ingestion:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare source for batch_load
      run: |
        mkdir -p /tmp/deploy-ingestion/ingestion
        # Copy ingestion package
        cp ingestion/__init__.py /tmp/deploy-ingestion/ingestion/
        cp ingestion/config.py /tmp/deploy-ingestion/ingestion/
        cp ingestion/batch_load.py /tmp/deploy-ingestion/ingestion/
        cp ingestion/cache_enqueuer.py /tmp/deploy-ingestion/ingestion/
        # Create main.py entry point
        cp ingestion/batch_load.py /tmp/deploy-ingestion/main.py
        # Copy requirements
        cp ingestion/requirements.txt /tmp/deploy-ingestion/requirements.txt

    - name: Deploy v3_batch_load to us-central1
      run: |
        gcloud functions deploy "v3_batch_load_gcs_to_bq" \
          --region "us-central1" \
          --entry-point "batch_load_gcs_to_bq" \
          --runtime python312 \
          --trigger-http \
          --allow-unauthenticated \
          --memory="512MB" \
          --timeout="3600s" \
          --gen2 \
          --source /tmp/deploy-ingestion/

  # --- Ingestion dedup views ---
  deploy-dedup-views:
    needs: deploy-ingestion
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Deploy dedup views (author_latest, pub_latest)
      run: bq query --project_id=${{ env.PROJECT_ID }} --use_legacy_sql=false < ingestion/dedup_views.sql

  # --- Author search function ---
  deploy-author-search:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        region: ["us-central1", "us-east1", "us-east4", "us-east5", "us-south1", "us-west1", "us-west2", "us-west3", "us-west4", "northamerica-northeast1", "northamerica-northeast2", "europe-west1", "europe-west2", "asia-east1", "asia-northeast1"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare source for v3_search_authors
      run: |
        mkdir -p /tmp/deploy-search/author_search
        # Copy author_search package
        cp author_search/__init__.py /tmp/deploy-search/author_search/
        cp author_search/config.py /tmp/deploy-search/author_search/
        cp author_search/bigquery_client.py /tmp/deploy-search/author_search/
        cp author_search/scholar_client.py /tmp/deploy-search/author_search/
        cp author_search/cache.py /tmp/deploy-search/author_search/
        cp author_search/search_service.py /tmp/deploy-search/author_search/
        # Copy entry point as main.py
        cp author_search/main.py /tmp/deploy-search/main.py
        # Copy requirements
        cp author_search/requirements.txt /tmp/deploy-search/requirements.txt

    - name: Deploy v3_search_authors to ${{ matrix.region }}
      run: |
        for attempt in 1 2 3 4; do
          gcloud functions deploy "v3_search_authors" \
            --region "${{ matrix.region }}" \
            --entry-point "v3_search_authors" \
            --runtime python312 \
            --trigger-http \
            --allow-unauthenticated \
            --memory="512MB" \
            --timeout="60s" \
            --gen2 \
            --source /tmp/deploy-search/ \
          && break
          echo "Attempt $attempt failed. Retrying in $((attempt * 30))s..."
          sleep $((attempt * 30))
        done

  # --- Refresh functions (refresh_stale, refresh_errors, expand_coauthors) ---
  deploy-refresh:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function:
          - name: v3_refresh_stale
            entry_point: refresh_stale
            timeout: "300s"
          - name: v3_refresh_errors
            entry_point: refresh_errors
            timeout: "300s"
          - name: v3_expand_coauthors
            entry_point: expand_coauthors
            timeout: "300s"

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Get Cache Layer URL
      id: cache-url
      run: |
        URL=$(gcloud run services describe v3-cache-layer \
          --region=us-central1 \
          --format='value(status.url)' \
          --project=${{ env.PROJECT_ID }})
        echo "URL=$URL" >> "$GITHUB_OUTPUT"

    - name: Prepare source for ${{ matrix.function.name }}
      run: |
        mkdir -p /tmp/deploy-refresh/refresh /tmp/deploy-refresh/region_health
        # Copy refresh package
        cp refresh/__init__.py /tmp/deploy-refresh/refresh/
        cp refresh/config.py /tmp/deploy-refresh/refresh/
        cp refresh/bigquery_client.py /tmp/deploy-refresh/refresh/
        cp refresh/task_enqueuer.py /tmp/deploy-refresh/refresh/
        cp refresh/refresh_service.py /tmp/deploy-refresh/refresh/
        # Copy region_health package (config + router only; scorer not needed)
        cp region_health/__init__.py /tmp/deploy-refresh/region_health/
        cp region_health/config.py /tmp/deploy-refresh/region_health/
        cp region_health/router.py /tmp/deploy-refresh/region_health/
        # Copy entry point as main.py
        cp refresh/main.py /tmp/deploy-refresh/main.py
        # Copy requirements
        cp refresh/requirements.txt /tmp/deploy-refresh/requirements.txt

    - name: Deploy ${{ matrix.function.name }} to us-central1
      run: |
        for attempt in 1 2 3 4; do
          gcloud functions deploy "${{ matrix.function.name }}" \
            --region "us-central1" \
            --entry-point "${{ matrix.function.entry_point }}" \
            --runtime python312 \
            --trigger-http \
            --allow-unauthenticated \
            --memory="512MB" \
            --timeout="${{ matrix.function.timeout }}" \
            --gen2 \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},CACHE_LAYER_URL=${{ steps.cache-url.outputs.URL }},QUEUE_LOCATION=northamerica-northeast1" \
            --source /tmp/deploy-refresh/ \
          && break
          echo "Attempt $attempt failed. Retrying in $((attempt * 30))s..."
          sleep $((attempt * 30))
        done

  # --- Dead-letter handler (for priority queue failures) ---
  deploy-dead-letter-handler:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Prepare source for v3_dead_letter_handler
      run: |
        mkdir -p /tmp/deploy-deadletter/crawler
        cp crawler/__init__.py /tmp/deploy-deadletter/crawler/
        cp crawler/dead_letter_handler.py /tmp/deploy-deadletter/crawler/
        cp crawler/dead_letter_handler.py /tmp/deploy-deadletter/main.py
        cp crawler/requirements.txt /tmp/deploy-deadletter/requirements.txt

    - name: Deploy v3_dead_letter_handler to us-central1
      run: |
        gcloud functions deploy "v3_dead_letter_handler" \
          --region "us-central1" \
          --entry-point "v3_dead_letter_handler" \
          --runtime python312 \
          --trigger-http \
          --no-allow-unauthenticated \
          --memory="256MB" \
          --timeout="30s" \
          --gen2 \
          --source /tmp/deploy-deadletter/

    - name: Create or update Pub/Sub push subscription
      run: |
        DL_URL=$(gcloud functions describe v3_dead_letter_handler \
          --region=us-central1 \
          --format='value(serviceConfig.uri)' \
          --project=${{ env.PROJECT_ID }})
        if ! gcloud pubsub subscriptions describe crawler-task-deadletter-push \
            --project=${{ env.PROJECT_ID }} > /dev/null 2>&1; then
          gcloud pubsub subscriptions create crawler-task-deadletter-push \
            --topic=crawler-task-deadletter \
            --push-endpoint="$DL_URL" \
            --ack-deadline=30 \
            --project=${{ env.PROJECT_ID }}
          echo "Created push subscription"
        else
          gcloud pubsub subscriptions update crawler-task-deadletter-push \
            --push-config-endpoint="$DL_URL" \
            --project=${{ env.PROJECT_ID }}
          echo "Updated push subscription"
        fi

  # Cloud Scheduler for batch loading (hourly)
  deploy-batch-load-scheduler:
    needs: deploy-ingestion
    runs-on: ubuntu-latest

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.PROJECT_ID }}

    - name: Create or update Cloud Scheduler job for batch loading
      run: |
        JOB_NAME="batch-load-gcs-to-bq"
        LOCATION="us-central1"
        SCHEDULE="0 * * * *"
        TARGET_URL="https://${LOCATION}-${{ env.PROJECT_ID }}.cloudfunctions.net/v3_batch_load_gcs_to_bq"
        TIME_ZONE="UTC"

        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" --project="${{ env.PROJECT_ID }}" > /dev/null 2>&1; then
          echo "Updating existing scheduler job: $JOB_NAME"
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="$SCHEDULE" \
            --uri="$TARGET_URL" \
            --http-method=GET \
            --time-zone="$TIME_ZONE" \
            --attempt-deadline=1800s
        else
          echo "Creating new scheduler job: $JOB_NAME"
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="$SCHEDULE" \
            --uri="$TARGET_URL" \
            --http-method=GET \
            --time-zone="$TIME_ZONE" \
            --attempt-deadline=1800s
        fi
