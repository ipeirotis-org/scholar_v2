# .github/workflows/main.yml — Deploy v3 Frontend to Cloud Run

name: Build and Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: scholar-service
  GAR_LOCATION: us-central1
  REPOSITORY_NAME: scholar-repo
  IMAGE_NAME: scholar_v2

jobs:
  deploy-frontend:
    name: Build and Deploy v3 Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build and Push Image to Artifact Registry
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |-
        gcloud builds submit \
          --config /dev/stdin <<CLOUDBUILD
        steps:
          - name: 'gcr.io/cloud-builders/docker'
            args: ['build', '-f', 'v3/frontend/Dockerfile', '-t', '$IMAGE_PATH', '.']
        images: ['$IMAGE_PATH']
        CLOUDBUILD

    - name: Deploy to Cloud Run
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |-
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image "$IMAGE_PATH" \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},REFRESH_SERVICE_URL=https://v3-refresh-service-${{ env.GCP_PROJECT_ID }}.run.app"

  deploy-refresh-service:
    name: Build and Deploy v3 Refresh & Expand Service
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Prepare source for Refresh service
      run: |
        mkdir -p /tmp/deploy-refresh/refresh
        # Copy refresh package
        cp v3/refresh/__init__.py /tmp/deploy-refresh/refresh/
        cp v3/refresh/config.py /tmp/deploy-refresh/refresh/
        cp v3/refresh/bigquery_client.py /tmp/deploy-refresh/refresh/
        cp v3/refresh/task_enqueuer.py /tmp/deploy-refresh/refresh/
        cp v3/refresh/refresh_service.py /tmp/deploy-refresh/refresh/
        # Copy entry point as main.py
        cp v3/refresh/main.py /tmp/deploy-refresh/main.py
        # Copy requirements
        cp v3/refresh/requirements.txt /tmp/deploy-refresh/requirements.txt
        # Fix imports: v3.refresh -> refresh
        sed -i 's/from v3\.refresh\./from refresh./g' /tmp/deploy-refresh/refresh/*.py
        sed -i 's/from v3\.refresh\./from refresh./g' /tmp/deploy-refresh/main.py
        sed -i 's/from v3\.refresh /from refresh /g' /tmp/deploy-refresh/refresh/*.py
        sed -i 's/from v3\.refresh /from refresh /g' /tmp/deploy-refresh/main.py

    - name: Deploy Refresh service to Cloud Run
      run: |-
        gcloud run deploy v3-refresh-service \
          --source /tmp/deploy-refresh/ \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --memory=512Mi \
          --timeout=300 \
          --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"

  deploy-refresh-schedulers:
    name: Set up Cloud Scheduler for Refresh operations
    needs: deploy-refresh-service
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Get Refresh service URL
      id: get-url
      run: |
        URL=$(gcloud run services describe v3-refresh-service \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)' \
          --project=${{ env.GCP_PROJECT_ID }})
        echo "REFRESH_URL=$URL" >> "$GITHUB_OUTPUT"

    - name: Create or update scheduler — refresh stale authors (daily 02:00 UTC)
      run: |
        JOB_NAME="v3-refresh-stale-authors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 2 * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/refresh_stale" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 2 * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/refresh_stale" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi

    - name: Create or update scheduler — refresh error authors (daily 03:00 UTC)
      run: |
        JOB_NAME="v3-refresh-error-authors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 3 * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/refresh_errors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 3 * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/refresh_errors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi

    - name: Create or update scheduler — expand coauthors (every 10 min)
      run: |
        JOB_NAME="v3-expand-coauthors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="*/10 * * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/expand_coauthors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="*/10 * * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/expand_coauthors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi
