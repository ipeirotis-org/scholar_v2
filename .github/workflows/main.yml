# .github/workflows/main.yml — Deploy v3 Frontend to Cloud Run

name: Build and Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: scholar-service
  GAR_LOCATION: us-central1
  REPOSITORY_NAME: scholar-repo
  IMAGE_NAME: scholar_v2

jobs:
  deploy-frontend:
    name: Build and Deploy v3 Frontend
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build and Push Image to Artifact Registry
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |-
        gcloud builds submit \
          --config /dev/stdin <<CLOUDBUILD
        steps:
          - name: 'gcr.io/cloud-builders/docker'
            args: ['build', '-f', 'frontend/Dockerfile', '-t', '$IMAGE_PATH', '.']
        images: ['$IMAGE_PATH']
        CLOUDBUILD

    - name: Deploy to Cloud Run
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |-
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image "$IMAGE_PATH" \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},REFRESH_SERVICE_URL=https://v3-refresh-service-${{ env.GCP_PROJECT_ID }}.run.app"

    - name: Get Cloud Run service URL
      id: service-url
      run: |
        URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)' \
          --project=${{ env.GCP_PROJECT_ID }})
        echo "URL=$URL" >> "$GITHUB_OUTPUT"

    - name: Post-deploy speed check (warm-up + cached path)
      run: |
        SERVICE_URL="${{ steps.service-url.outputs.URL }}"
        echo "Service URL: $SERVICE_URL"

        # Step 1: Warm-up request populates the cache.
        # Cloud Run cold start + BigQuery can take 60s+, so give it room.
        echo "Warming cache (this may take a while on cold start)..."
        WARM_RESPONSE=$(curl -s --max-time 120 "$SERVICE_URL/api/speed_check?threshold=120" || true)
        if [ -z "$WARM_RESPONSE" ]; then
          echo "::warning::Warm-up request timed out or failed — skipping speed check"
          exit 0
        fi
        echo "Warm-up response:"
        echo "$WARM_RESPONSE" | python3 -m json.tool || echo "$WARM_RESPONSE"

        # Step 2: Wait for Firestore write propagation
        sleep 5

        # Step 3: Cached request should be fast (<5s threshold).
        # Retry up to 3 times in case of transient Firestore latency.
        PASSED=false
        for ATTEMPT in 1 2 3; do
          echo "Speed check attempt $ATTEMPT/3..."
          RESPONSE=$(curl -s --max-time 15 "$SERVICE_URL/api/speed_check?threshold=5" || true)
          if [ -z "$RESPONSE" ]; then
            echo "  Request timed out"
            sleep 3
            continue
          fi
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo "error")
          if [ "$STATUS" = "ok" ]; then
            PASSED=true
            break
          fi
          echo "  Status: $STATUS (not ok), retrying..."
          sleep 3
        done

        if [ "$PASSED" = "true" ]; then
          echo "Speed check passed"
        else
          echo "::error::Speed check failed — cached path is too slow after 3 attempts"
          exit 1
        fi

  deploy-refresh-service:
    name: Build and Deploy v3 Refresh & Expand Service
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Prepare source for Refresh service
      run: |
        mkdir -p /tmp/deploy-refresh/refresh
        # Copy refresh package
        cp refresh/__init__.py /tmp/deploy-refresh/refresh/
        cp refresh/config.py /tmp/deploy-refresh/refresh/
        cp refresh/bigquery_client.py /tmp/deploy-refresh/refresh/
        cp refresh/task_enqueuer.py /tmp/deploy-refresh/refresh/
        cp refresh/refresh_service.py /tmp/deploy-refresh/refresh/
        # Copy entry point as main.py
        cp refresh/main.py /tmp/deploy-refresh/main.py
        # Copy requirements
        cp refresh/requirements.txt /tmp/deploy-refresh/requirements.txt

    - name: Deploy Refresh service to Cloud Run
      run: |-
        gcloud run deploy v3-refresh-service \
          --source /tmp/deploy-refresh/ \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --memory=512Mi \
          --timeout=300 \
          --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }}"

  deploy-refresh-schedulers:
    name: Set up Cloud Scheduler for Refresh operations
    needs: deploy-refresh-service
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Get Refresh service URL
      id: get-url
      run: |
        URL=$(gcloud run services describe v3-refresh-service \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)' \
          --project=${{ env.GCP_PROJECT_ID }})
        echo "REFRESH_URL=$URL" >> "$GITHUB_OUTPUT"

    - name: Create or update scheduler — refresh stale authors (daily 02:00 UTC)
      run: |
        JOB_NAME="v3-refresh-stale-authors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 2 * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/refresh_stale" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 2 * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/refresh_stale" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi

    - name: Create or update scheduler — refresh error authors (daily 03:00 UTC)
      run: |
        JOB_NAME="v3-refresh-error-authors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 3 * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/refresh_errors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 3 * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/refresh_errors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi

    - name: Create or update scheduler — expand coauthors (every 10 min)
      run: |
        JOB_NAME="v3-expand-coauthors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="*/10 * * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/expand_coauthors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="*/10 * * * *" \
            --uri="${{ steps.get-url.outputs.REFRESH_URL }}/expand_coauthors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi
