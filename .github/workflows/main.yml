# .github/workflows/main.yml — Deploy Cloud Run services

name: Build and Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  SERVICE_NAME: scholar-service
  GAR_LOCATION: us-central1
  REPOSITORY_NAME: scholar-repo
  IMAGE_NAME: scholar_v2
  CACHE_LAYER_SERVICE: v3-cache-layer
  CACHE_LAYER_IMAGE: cache_layer
  REFRESH_SERVICE: v3-refresh-service
  QUEUE_LOCATION: northamerica-northeast1

jobs:
  # ── Phase 0: Infrastructure (queues) ──────────────────────────────────────
  ensure-queues:
    name: Ensure Cloud Tasks queues exist
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Create cache-priority queue (if not exists)
      run: |
        if ! gcloud tasks queues describe cache-priority \
            --location=${{ env.QUEUE_LOCATION }} > /dev/null 2>&1; then
          gcloud tasks queues create cache-priority \
            --location=${{ env.QUEUE_LOCATION }} \
            --max-dispatches-per-second=50 \
            --max-concurrent-dispatches=20 \
            --max-attempts=3 \
            --min-backoff=10s \
            --max-backoff=60s
          echo "Created cache-priority queue"
        else
          echo "cache-priority queue already exists"
        fi

    - name: Create cache-batch queue (if not exists)
      run: |
        if ! gcloud tasks queues describe cache-batch \
            --location=${{ env.QUEUE_LOCATION }} > /dev/null 2>&1; then
          gcloud tasks queues create cache-batch \
            --location=${{ env.QUEUE_LOCATION }} \
            --max-dispatches-per-second=5 \
            --max-concurrent-dispatches=3 \
            --max-attempts=3 \
            --min-backoff=30s \
            --max-backoff=300s
          echo "Created cache-batch queue"
        else
          echo "cache-batch queue already exists"
        fi

  # ── Phase 1: Deploy Cache Layer (no dependencies on other services) ──────
  deploy-cache-layer:
    name: Build and Deploy Cache Layer
    needs: ensure-queues
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build and Push Cache Layer Image
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.CACHE_LAYER_IMAGE }}:${{ github.sha }}
      run: |-
        gcloud builds submit \
          --config /dev/stdin <<CLOUDBUILD
        steps:
          - name: 'gcr.io/cloud-builders/docker'
            args: ['build', '-f', 'cache_layer/Dockerfile', '-t', '$IMAGE_PATH', '.']
        images: ['$IMAGE_PATH']
        CLOUDBUILD

    - name: Deploy Cache Layer to Cloud Run
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.CACHE_LAYER_IMAGE }}:${{ github.sha }}
      run: |-
        gcloud run deploy ${{ env.CACHE_LAYER_SERVICE }} \
          --image "$IMAGE_PATH" \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --no-allow-unauthenticated \
          --memory=1Gi \
          --timeout=300 \
          --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},QUEUE_LOCATION=${{ env.QUEUE_LOCATION }}"

    - name: Get Cache Layer URL
      id: cache-url
      run: |
        URL=$(gcloud run services describe ${{ env.CACHE_LAYER_SERVICE }} \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)' \
          --project=${{ env.GCP_PROJECT_ID }})
        echo "URL=$URL" >> "$GITHUB_OUTPUT"

    - name: Health check
      run: |
        HEALTH_URL="${{ steps.cache-url.outputs.URL }}/health"
        echo "Checking $HEALTH_URL..."
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$HEALTH_URL" || echo "000")
        if [ "$STATUS" = "200" ]; then
          echo "Cache layer healthy"
        else
          echo "::warning::Cache layer health check returned $STATUS (may need auth token)"
        fi

    outputs:
      cache_layer_url: ${{ steps.cache-url.outputs.URL }}

  # ── Phase 2: Deploy Frontend (depends on cache layer URL) ────────────────
  deploy-frontend:
    name: Build and Deploy v3 Frontend
    needs: deploy-cache-layer
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev

    - name: Build and Push Image to Artifact Registry
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      run: |-
        gcloud builds submit \
          --config /dev/stdin <<CLOUDBUILD
        steps:
          - name: 'gcr.io/cloud-builders/docker'
            args: ['build', '-f', 'frontend/Dockerfile', '-t', '$IMAGE_PATH', '.']
        images: ['$IMAGE_PATH']
        CLOUDBUILD

    - name: Deploy to Cloud Run
      env:
        IMAGE_PATH: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.REPOSITORY_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        CACHE_LAYER_URL: ${{ needs.deploy-cache-layer.outputs.cache_layer_url }}
      run: |-
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image "$IMAGE_PATH" \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},REFRESH_SERVICE_URL=https://${{ env.REFRESH_SERVICE }}-${{ env.GCP_PROJECT_ID }}.run.app,CACHE_LAYER_URL=$CACHE_LAYER_URL,QUEUE_LOCATION=${{ env.QUEUE_LOCATION }}"

    - name: Get Cloud Run service URL
      id: service-url
      run: |
        URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)' \
          --project=${{ env.GCP_PROJECT_ID }})
        echo "URL=$URL" >> "$GITHUB_OUTPUT"

    - name: Post-deploy speed check (warm-up + cached path)
      run: |
        SERVICE_URL="${{ steps.service-url.outputs.URL }}"
        echo "Service URL: $SERVICE_URL"

        # Step 1: Warm-up request — cache layer should serve from Firestore.
        echo "Warming cache (this may take a while on cold start)..."
        WARM_RESPONSE=$(curl -s --max-time 120 "$SERVICE_URL/api/speed_check?threshold=120" || true)
        if [ -z "$WARM_RESPONSE" ]; then
          echo "::warning::Warm-up request timed out or failed — skipping speed check"
          exit 0
        fi
        echo "Warm-up response:"
        echo "$WARM_RESPONSE" | python3 -m json.tool || echo "$WARM_RESPONSE"

        # Step 2: Wait for Firestore write propagation
        sleep 5

        # Step 3: Cached request should be fast (<5s threshold).
        # Retry up to 3 times in case of transient Firestore latency.
        PASSED=false
        for ATTEMPT in 1 2 3; do
          echo "Speed check attempt $ATTEMPT/3..."
          RESPONSE=$(curl -s --max-time 15 "$SERVICE_URL/api/speed_check?threshold=5" || true)
          if [ -z "$RESPONSE" ]; then
            echo "  Request timed out"
            sleep 3
            continue
          fi
          echo "$RESPONSE" | python3 -m json.tool || echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('status','error'))" 2>/dev/null || echo "error")
          if [ "$STATUS" = "ok" ]; then
            PASSED=true
            break
          fi
          echo "  Status: $STATUS (not ok), retrying..."
          sleep 3
        done

        if [ "$PASSED" = "true" ]; then
          echo "Speed check passed"
        else
          echo "::error::Speed check failed — cached path is too slow after 3 attempts"
          exit 1
        fi

  # ── Phase 2b: Deploy Refresh Service (parallel with frontend) ────────────
  deploy-refresh-service:
    name: Build and Deploy v3 Refresh & Expand Service
    needs: deploy-cache-layer
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Prepare source for Refresh service
      run: |
        mkdir -p /tmp/deploy-refresh/refresh
        # Copy refresh package
        cp refresh/__init__.py /tmp/deploy-refresh/refresh/
        cp refresh/config.py /tmp/deploy-refresh/refresh/
        cp refresh/bigquery_client.py /tmp/deploy-refresh/refresh/
        cp refresh/task_enqueuer.py /tmp/deploy-refresh/refresh/
        cp refresh/refresh_service.py /tmp/deploy-refresh/refresh/
        # Copy entry point as main.py
        cp refresh/main.py /tmp/deploy-refresh/main.py
        # Copy requirements
        cp refresh/requirements.txt /tmp/deploy-refresh/requirements.txt

    - name: Deploy Refresh service to Cloud Run
      env:
        CACHE_LAYER_URL: ${{ needs.deploy-cache-layer.outputs.cache_layer_url }}
      run: |-
        gcloud run deploy ${{ env.REFRESH_SERVICE }} \
          --source /tmp/deploy-refresh/ \
          --platform managed \
          --region ${{ env.GCP_REGION }} \
          --allow-unauthenticated \
          --memory=512Mi \
          --timeout=300 \
          --set-env-vars="GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},CACHE_LAYER_URL=$CACHE_LAYER_URL,QUEUE_LOCATION=${{ env.QUEUE_LOCATION }}"

  # ── Phase 3: Schedulers (after services are deployed) ────────────────────
  deploy-schedulers:
    name: Set up Cloud Scheduler jobs
    needs: [deploy-refresh-service, deploy-cache-layer]
    runs-on: ubuntu-latest

    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v3
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Get Refresh service URL
      id: get-refresh-url
      run: |
        URL=$(gcloud run services describe ${{ env.REFRESH_SERVICE }} \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)' \
          --project=${{ env.GCP_PROJECT_ID }})
        echo "REFRESH_URL=$URL" >> "$GITHUB_OUTPUT"

    - name: Get Cache Layer URL
      id: get-cache-url
      run: |
        URL=$(gcloud run services describe ${{ env.CACHE_LAYER_SERVICE }} \
          --region=${{ env.GCP_REGION }} \
          --format='value(status.url)' \
          --project=${{ env.GCP_PROJECT_ID }})
        echo "CACHE_URL=$URL" >> "$GITHUB_OUTPUT"

    - name: Create or update scheduler — refresh stale authors (daily 02:00 UTC)
      run: |
        JOB_NAME="v3-refresh-stale-authors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 2 * * *" \
            --uri="${{ steps.get-refresh-url.outputs.REFRESH_URL }}/refresh_stale" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 2 * * *" \
            --uri="${{ steps.get-refresh-url.outputs.REFRESH_URL }}/refresh_stale" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi

    - name: Create or update scheduler — refresh error authors (daily 03:00 UTC)
      run: |
        JOB_NAME="v3-refresh-error-authors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 3 * * *" \
            --uri="${{ steps.get-refresh-url.outputs.REFRESH_URL }}/refresh_errors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="0 3 * * *" \
            --uri="${{ steps.get-refresh-url.outputs.REFRESH_URL }}/refresh_errors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi

    - name: Create or update scheduler — expand coauthors (every 10 min)
      run: |
        JOB_NAME="v3-expand-coauthors"
        LOCATION="${{ env.GCP_REGION }}"
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="*/10 * * * *" \
            --uri="${{ steps.get-refresh-url.outputs.REFRESH_URL }}/expand_coauthors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="*/10 * * * *" \
            --uri="${{ steps.get-refresh-url.outputs.REFRESH_URL }}/expand_coauthors" \
            --http-method=GET \
            --time-zone=UTC \
            --attempt-deadline=300s
        fi

    - name: Create or update scheduler — populate recent authors (every 5 min)
      run: |
        JOB_NAME="v3-populate-recent-authors"
        LOCATION="${{ env.GCP_REGION }}"
        CACHE_URL="${{ steps.get-cache-url.outputs.CACHE_URL }}"
        BODY='{"type":"populate_recent_authors"}'
        if gcloud scheduler jobs describe "$JOB_NAME" --location="$LOCATION" > /dev/null 2>&1; then
          gcloud scheduler jobs update http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="*/5 * * * *" \
            --uri="$CACHE_URL/tasks/batch" \
            --http-method=POST \
            --update-headers="Content-Type=application/json" \
            --message-body="$BODY" \
            --time-zone=UTC \
            --attempt-deadline=60s
        else
          gcloud scheduler jobs create http "$JOB_NAME" \
            --location="$LOCATION" \
            --schedule="*/5 * * * *" \
            --uri="$CACHE_URL/tasks/batch" \
            --http-method=POST \
            --headers="Content-Type=application/json" \
            --message-body="$BODY" \
            --time-zone=UTC \
            --attempt-deadline=60s
        fi
